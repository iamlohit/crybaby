<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>crybaby classifier — data flow</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12161f; --node: #1a2030; --text: #e8ecf4;
    --muted: #8b93a7; --blue: #4da3ff; --green: #3ddc84; --orange: #ff9f43;
    --yellow: #ffd60a; --gray: #6b7690;
  }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { text-align: center; padding: 28px 16px 4px; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 6px 0 0; color: var(--muted); }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 12px 16px 40px; }
  svg { width: 100%; height: auto; display: block; }
  .node { fill: var(--node); stroke-width: 2; rx: 12; }
  .grp { fill: var(--panel); stroke-width: 1.5; stroke-dasharray: 4 4; }
  text { fill: var(--text); font: 600 13px -apple-system, "Segoe UI", Roboto, sans-serif; }
  .sub { fill: var(--muted); font-weight: 400; font-size: 11px; }
  .grplbl { font-size: 12px; letter-spacing: 1.2px; font-weight: 700; }
  .lbl { font-size: 11.5px; font-weight: 600; }
  .flow { fill: none; stroke-width: 2.5; stroke-linecap: round;
    stroke-dasharray: 9 13; animation: dash 1.1s linear infinite; }
  .flow.slow { animation-duration: 1.9s; }
  .dot { filter: drop-shadow(0 0 6px currentColor); }
  @keyframes dash { to { stroke-dashoffset: -22; } }
</style>
</head>
<body>
<header>
  <h1>🧠 classifier service — two-stage pipeline</h1>
  <p>FastAPI · port 8977 · gate first, rank second — never a confident answer to a non-cry</p>
</header>
<div class="wrap">
<svg viewBox="0 0 1000 500" role="img" aria-label="crybaby classifier data flow">

  <rect class="grp" x="20" y="60" width="960" height="270" rx="16" stroke="#2f5d4a"/>
  <text class="grplbl" x="500" y="86" text-anchor="middle" fill="#69d2a1">POST /analyze · serving path</text>

  <rect class="grp" x="20" y="360" width="960" height="120" rx="16" stroke="#4a4432"/>
  <text class="grplbl" x="500" y="386" text-anchor="middle" fill="#d9c06a">offline · training path</text>

  <!-- serving path -->
  <rect class="node" x="45" y="120" width="150" height="60" stroke="var(--blue)"/>
  <text x="120" y="144" text-anchor="middle">📥 WAV in</text>
  <text class="sub" x="120" y="162" text-anchor="middle">from the device</text>

  <rect class="node" x="235" y="120" width="160" height="60" stroke="var(--blue)"/>
  <text x="315" y="144" text-anchor="middle">audio_pipeline</text>
  <text class="sub" x="315" y="162" text-anchor="middle">decode · mono · resample</text>

  <rect class="node" x="435" y="120" width="160" height="60" stroke="var(--orange)"/>
  <text x="515" y="144" text-anchor="middle">🚧 YAMNet gate</text>
  <text class="sub" x="515" y="162" text-anchor="middle">stage 1: is it a cry?</text>

  <rect class="node" x="635" y="120" width="160" height="60" stroke="var(--green)"/>
  <text x="715" y="144" text-anchor="middle">AST encoder</text>
  <text class="sub" x="715" y="162" text-anchor="middle">bundle-declared, mean-pool</text>

  <rect class="node" x="830" y="120" width="140" height="60" stroke="var(--green)"/>
  <text x="900" y="144" text-anchor="middle">logreg head</text>
  <text class="sub" x="900" y="162" text-anchor="middle">stage 2: rank causes</text>

  <rect class="node" x="435" y="230" width="160" height="52" stroke="var(--gray)" stroke-dasharray="5 4"/>
  <text x="515" y="252" text-anchor="middle">🙅 "no cry heard"</text>
  <text class="sub" x="515" y="269" text-anchor="middle">gate rejected → honest no</text>

  <rect class="node" x="680" y="230" width="200" height="52" stroke="var(--gray)" stroke-dasharray="5 4"/>
  <text x="780" y="252" text-anchor="middle">✨ Gemini second opinion</text>
  <text class="sub" x="780" y="269" text-anchor="middle">optional · GEMINI_API_KEY</text>

  <rect class="node" x="130" y="230" width="220" height="52" stroke="var(--green)"/>
  <text x="240" y="252" text-anchor="middle">📤 JSON out</text>
  <text class="sub" x="240" y="269" text-anchor="middle">is_cry + 5 ranked causes + probs</text>

  <!-- training path -->
  <rect class="node" x="80" y="405" width="200" height="52" stroke="var(--yellow)"/>
  <text x="180" y="427" text-anchor="middle">🗂 donateacry corpus</text>
  <text class="sub" x="180" y="444" text-anchor="middle">457 clips · 5 labels · skewed</text>

  <rect class="node" x="380" y="405" width="240" height="52" stroke="var(--yellow)"/>
  <text x="500" y="427" text-anchor="middle">benchmark.py --fit</text>
  <text class="sub" x="500" y="444" text-anchor="middle">encoder bake-off · fold-safe augment</text>

  <rect class="node" x="720" y="405" width="200" height="52" stroke="var(--yellow)"/>
  <text x="820" y="427" text-anchor="middle">📦 model.joblib</text>
  <text class="sub" x="820" y="444" text-anchor="middle">encoder + head + labels bundle</text>

  <!-- flows -->
  <path id="c-in" class="flow" stroke="var(--blue)" d="M 197 150 L 233 150"/>
  <path id="c-pre" class="flow" stroke="var(--blue)" d="M 397 150 L 433 150"/>
  <path id="c-gate" class="flow" stroke="var(--orange)" d="M 597 150 L 633 150"/>
  <text class="lbl" x="615" y="138" fill="var(--orange)">cry ✓</text>
  <path id="c-rej" class="flow slow" stroke="var(--gray)" d="M 515 182 L 515 228"/>
  <text class="lbl" x="545" y="210" fill="var(--gray)">cry ✗</text>
  <path id="c-emb" class="flow" stroke="var(--green)" d="M 797 150 L 828 150"/>
  <path id="c-gem" class="flow slow" stroke="var(--gray)" d="M 880 182 C 860 205, 850 215, 830 228"/>
  <path id="c-out" class="flow" stroke="var(--green)" d="M 900 182 C 880 260, 500 256, 352 256"/>
  <text class="lbl" x="600" y="305" fill="var(--green)">ranked verdict → device</text>

  <path id="c-t1" class="flow slow" stroke="var(--yellow)" d="M 282 431 L 378 431"/>
  <path id="c-t2" class="flow slow" stroke="var(--yellow)" d="M 622 431 L 718 431"/>
  <path id="c-t3" class="flow slow" stroke="var(--yellow)" d="M 820 403 C 830 340, 830 250, 850 184"/>
  <text class="lbl" x="875" y="330" fill="var(--yellow)">loaded at startup</text>

  <!-- pulses -->
  <circle class="dot" r="5" fill="var(--blue)">
    <animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#c-in"/></animateMotion>
  </circle>
  <circle class="dot" r="5" fill="var(--orange)">
    <animateMotion dur="1.6s" begin=".4s" repeatCount="indefinite"><mpath href="#c-gate"/></animateMotion>
  </circle>
  <circle class="dot" r="5" fill="var(--green)">
    <animateMotion dur="2.6s" begin=".8s" repeatCount="indefinite"><mpath href="#c-out"/></animateMotion>
  </circle>
  <circle class="dot" r="5" fill="var(--yellow)">
    <animateMotion dur="3s" repeatCount="indefinite"><mpath href="#c-t3"/></animateMotion>
  </circle>
</svg>
</div>
</body>
</html>
