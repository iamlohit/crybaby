<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>crybaby firmware — data flow</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12161f; --node: #1a2030; --text: #e8ecf4;
    --muted: #8b93a7; --blue: #4da3ff; --green: #3ddc84; --orange: #ff9f43;
    --purple: #b388ff; --pink: #ff6b9d; --teal: #40e0d0;
  }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { text-align: center; padding: 28px 16px 4px; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 6px 0 0; color: var(--muted); }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 12px 16px 40px; }
  svg { width: 100%; height: auto; display: block; }
  .node { fill: var(--node); stroke-width: 2; rx: 12; }
  .grp { fill: var(--panel); stroke-width: 1.5; stroke-dasharray: 4 4; }
  text { fill: var(--text); font: 600 13px -apple-system, "Segoe UI", Roboto, sans-serif; }
  .sub { fill: var(--muted); font-weight: 400; font-size: 11px; }
  .grplbl { font-size: 12px; letter-spacing: 1.2px; font-weight: 700; }
  .lbl { font-size: 11.5px; font-weight: 600; }
  .flow { fill: none; stroke-width: 2.5; stroke-linecap: round;
    stroke-dasharray: 9 13; animation: dash 1.1s linear infinite; }
  .flow.slow { animation-duration: 1.7s; }
  .dot { filter: drop-shadow(0 0 6px currentColor); }
  @keyframes dash { to { stroke-dashoffset: -22; } }
</style>
</head>
<body>
<header>
  <h1>⚙️ firmware — inside the ESP32-S3</h1>
  <p>ESP-IDF 5.5 · LVGL 9 · one main loop, no RTOS task zoo</p>
</header>
<div class="wrap">
<svg viewBox="0 0 1000 520" role="img" aria-label="crybaby firmware data flow">

  <rect class="grp" x="20" y="60" width="960" height="440" rx="16" stroke="#3a4a68"/>
  <text class="grplbl" x="500" y="86" text-anchor="middle" fill="#7fa8e0">firmware/main</text>

  <!-- inputs -->
  <rect class="node" x="50" y="120" width="180" height="60" stroke="var(--orange)"/>
  <text x="140" y="144" text-anchor="middle">🔘 buttons · GPIO</text>
  <text class="sub" x="140" y="162" text-anchor="middle">middle analyze · right talk · left vol</text>

  <rect class="node" x="50" y="300" width="180" height="60" stroke="var(--orange)"/>
  <text x="140" y="324" text-anchor="middle">🎙 mic.c · I2S in</text>
  <text class="sub" x="140" y="342" text-anchor="middle">16 kHz DMA → PSRAM buffer</text>

  <!-- core -->
  <rect class="node" x="320" y="200" width="190" height="70" stroke="var(--blue)"/>
  <text x="415" y="228" text-anchor="middle">main.c · state loop</text>
  <text class="sub" x="415" y="246" text-anchor="middle">idle → record → send → show</text>

  <rect class="node" x="320" y="330" width="190" height="60" stroke="var(--blue)"/>
  <text x="415" y="354" text-anchor="middle">📡 net.c · Wi-Fi HTTP</text>
  <text class="sub" x="415" y="372" text-anchor="middle">POST /analyze · POST /talk</text>

  <!-- output pipeline -->
  <rect class="node" x="600" y="120" width="180" height="60" stroke="var(--teal)"/>
  <text x="690" y="144" text-anchor="middle">ui.c · LVGL screens</text>
  <text class="sub" x="690" y="162" text-anchor="middle">verdict bars · hints · states</text>

  <rect class="node" x="600" y="210" width="180" height="60" stroke="var(--teal)"/>
  <text x="690" y="234" text-anchor="middle">👀 eyes.c · moods</text>
  <text class="sub" x="690" y="252" text-anchor="middle">idle · listening · thinking · sad</text>

  <rect class="node" x="830" y="160" width="130" height="66" stroke="var(--teal)"/>
  <text x="895" y="186" text-anchor="middle">display.c</text>
  <text class="sub" x="895" y="204" text-anchor="middle">ST7789 SPI · 240×240</text>

  <rect class="node" x="600" y="330" width="180" height="60" stroke="var(--pink)"/>
  <text x="690" y="354" text-anchor="middle">🔊 speaker.c · I2S out</text>
  <text class="sub" x="690" y="372" text-anchor="middle">reply WAV · boot chime</text>

  <!-- LAN services (external) -->
  <rect class="node" x="320" y="430" width="190" height="52" stroke="var(--green)" stroke-dasharray="5 4"/>
  <text x="415" y="452" text-anchor="middle">🌐 LAN services</text>
  <text class="sub" x="415" y="469" text-anchor="middle">classifier :8977 · voicebot :8978</text>

  <!-- flows -->
  <path id="f-btn" class="flow" stroke="var(--orange)" d="M 232 150 C 290 160, 300 200, 330 200"/>
  <path id="f-rec" class="flow" stroke="var(--orange)" d="M 330 260 C 290 280, 280 310, 232 322"/>
  <text class="lbl" x="268" y="270" fill="var(--orange)">start rec</text>
  <path id="f-pcm" class="flow" stroke="var(--orange)" d="M 232 340 L 318 350"/>
  <text class="lbl" x="262" y="368" fill="var(--orange)">PCM</text>
  <path id="f-net" class="flow" stroke="var(--green)" d="M 415 392 L 415 428"/>
  <text class="lbl" x="455" y="414" fill="var(--green)">WAV ⇄ JSON</text>
  <path id="f-resp" class="flow" stroke="var(--blue)" d="M 512 350 C 545 330, 545 290, 512 262"/>
  <text class="lbl" x="548" y="308" fill="var(--blue)">response</text>
  <path id="f-ui" class="flow" stroke="var(--teal)" d="M 512 220 C 550 200, 560 160, 598 152"/>
  <path id="f-eyes" class="flow slow" stroke="var(--teal)" d="M 690 182 L 690 208"/>
  <path id="f-disp1" class="flow" stroke="var(--teal)" d="M 782 160 C 805 160, 810 175, 828 180"/>
  <path id="f-disp2" class="flow" stroke="var(--teal)" d="M 782 235 C 805 230, 810 215, 828 208"/>
  <path id="f-spk" class="flow" stroke="var(--pink)" d="M 512 380 C 545 375, 560 365, 598 358"/>
  <text class="lbl" x="536" y="400" fill="var(--pink)">reply WAV</text>

  <!-- pulses -->
  <circle class="dot" r="5" fill="var(--orange)">
    <animateMotion dur="2s" repeatCount="indefinite"><mpath href="#f-btn"/></animateMotion>
  </circle>
  <circle class="dot" r="5" fill="var(--orange)">
    <animateMotion dur="2.2s" begin=".5s" repeatCount="indefinite"><mpath href="#f-pcm"/></animateMotion>
  </circle>
  <circle class="dot" r="5" fill="var(--green)">
    <animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#f-net"/></animateMotion>
  </circle>
  <circle class="dot" r="5" fill="var(--blue)">
    <animateMotion dur="2s" begin=".9s" repeatCount="indefinite"><mpath href="#f-resp"/></animateMotion>
  </circle>
  <circle class="dot" r="5" fill="var(--teal)">
    <animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#f-ui"/></animateMotion>
  </circle>
  <circle class="dot" r="5" fill="var(--pink)">
    <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#f-spk"/></animateMotion>
  </circle>
</svg>
</div>
</body>
</html>
