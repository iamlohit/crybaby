<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>crybaby voicebot — data flow</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12161f; --node: #1a2030; --text: #e8ecf4;
    --muted: #8b93a7; --blue: #4da3ff; --purple: #b388ff; --pink: #ff6b9d;
    --teal: #40e0d0; --gray: #6b7690;
  }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { text-align: center; padding: 28px 16px 4px; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 6px 0 0; color: var(--muted); }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 12px 16px 40px; }
  svg { width: 100%; height: auto; display: block; }
  .node { fill: var(--node); stroke-width: 2; rx: 12; }
  .grp { fill: var(--panel); stroke-width: 1.5; stroke-dasharray: 4 4; }
  text { fill: var(--text); font: 600 13px -apple-system, "Segoe UI", Roboto, sans-serif; }
  .sub { fill: var(--muted); font-weight: 400; font-size: 11px; }
  .grplbl { font-size: 12px; letter-spacing: 1.2px; font-weight: 700; }
  .lbl { font-size: 11.5px; font-weight: 600; }
  .flow { fill: none; stroke-width: 2.5; stroke-linecap: round;
    stroke-dasharray: 9 13; animation: dash 1.1s linear infinite; }
  .flow.slow { animation-duration: 1.9s; }
  .dot { filter: drop-shadow(0 0 6px currentColor); }
  @keyframes dash { to { stroke-dashoffset: -22; } }
</style>
</head>
<body>
<header>
  <h1>🗣 voicebot service — push-to-talk pipeline</h1>
  <p>FastAPI · port 8978 · the device answers questions about itself, out loud</p>
</header>
<div class="wrap">
<svg viewBox="0 0 1000 460" role="img" aria-label="crybaby voicebot data flow">

  <rect class="grp" x="20" y="60" width="960" height="230" rx="16" stroke="#5a4a78"/>
  <text class="grplbl" x="500" y="86" text-anchor="middle" fill="#b9a0e8">POST /talk</text>

  <rect class="grp" x="20" y="320" width="960" height="110" rx="16" stroke="#3a4a68"/>
  <text class="grplbl" x="500" y="346" text-anchor="middle" fill="#7fa8e0">assembled once at startup</text>

  <!-- pipeline -->
  <rect class="node" x="45" y="120" width="150" height="60" stroke="var(--blue)"/>
  <text x="120" y="144" text-anchor="middle">📥 speech WAV</text>
  <text class="sub" x="120" y="162" text-anchor="middle">right button held on device</text>

  <rect class="node" x="235" y="120" width="170" height="60" stroke="var(--purple)"/>
  <text x="320" y="144" text-anchor="middle">faster-whisper</text>
  <text class="sub" x="320" y="162" text-anchor="middle">STT · CPU int8</text>

  <rect class="node" x="445" y="120" width="190" height="60" stroke="var(--purple)"/>
  <text x="540" y="144" text-anchor="middle">🤖 claude -p · haiku</text>
  <text class="sub" x="540" y="162" text-anchor="middle">headless CLI · session resumed</text>

  <rect class="node" x="675" y="120" width="140" height="60" stroke="var(--purple)"/>
  <text x="745" y="144" text-anchor="middle">speakable filter</text>
  <text class="sub" x="745" y="162" text-anchor="middle">strip markdown for TTS</text>

  <rect class="node" x="850" y="120" width="125" height="60" stroke="var(--pink)"/>
  <text x="912" y="144" text-anchor="middle">Piper TTS</text>
  <text class="sub" x="912" y="162" text-anchor="middle">hfc_female voice</text>

  <rect class="node" x="530" y="215" width="250" height="52" stroke="var(--pink)"/>
  <text x="655" y="237" text-anchor="middle">🔉 resample 16 kHz + normalise</text>
  <text class="sub" x="655" y="254" text-anchor="middle">consistent level for the tiny speaker</text>

  <rect class="node" x="130" y="215" width="290" height="52" stroke="var(--teal)"/>
  <text x="275" y="237" text-anchor="middle">📤 WAV + X-Transcript + X-Reply-Text</text>
  <text class="sub" x="275" y="254" text-anchor="middle">device plays audio, shows both texts</text>

  <!-- context sources -->
  <rect class="node" x="90" y="365" width="230" height="52" stroke="var(--gray)"/>
  <text x="205" y="387" text-anchor="middle">📚 project docs</text>
  <text class="sub" x="205" y="404" text-anchor="middle">README + HARDWARE.md</text>

  <rect class="node" x="400" y="365" width="230" height="52" stroke="var(--gray)"/>
  <text x="515" y="387" text-anchor="middle">📦 live model card</text>
  <text class="sub" x="515" y="404" text-anchor="middle">read from deployed model.joblib</text>

  <rect class="node" x="710" y="365" width="220" height="52" stroke="var(--gray)"/>
  <text x="820" y="387" text-anchor="middle">🧾 system prompt</text>
  <text class="sub" x="820" y="404" text-anchor="middle">answer honestly, 3 short sentences</text>

  <!-- flows -->
  <path id="v-in" class="flow" stroke="var(--blue)" d="M 197 150 L 233 150"/>
  <path id="v-stt" class="flow" stroke="var(--purple)" d="M 407 150 L 443 150"/>
  <text class="lbl" x="425" y="138" fill="var(--purple)">text</text>
  <path id="v-llm" class="flow" stroke="var(--purple)" d="M 637 150 L 673 150"/>
  <text class="lbl" x="655" y="138" fill="var(--purple)">reply</text>
  <path id="v-tts" class="flow" stroke="var(--pink)" d="M 817 150 L 848 150"/>
  <path id="v-post" class="flow" stroke="var(--pink)" d="M 912 182 C 900 220, 830 236, 782 240"/>
  <path id="v-out" class="flow" stroke="var(--teal)" d="M 528 241 L 422 241"/>
  <text class="lbl" x="470" y="230" fill="var(--teal)">reply → device</text>

  <path id="v-c1" class="flow slow" stroke="var(--gray)" d="M 322 391 L 398 391"/>
  <path id="v-c2" class="flow slow" stroke="var(--gray)" d="M 632 391 L 708 391"/>
  <path id="v-c3" class="flow slow" stroke="var(--gray)" d="M 820 363 C 810 300, 620 260, 580 184"/>
  <text class="lbl" x="770" y="305" fill="var(--gray)">first turn only</text>

  <!-- pulses -->
  <circle class="dot" r="5" fill="var(--blue)">
    <animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#v-in"/></animateMotion>
  </circle>
  <circle class="dot" r="5" fill="var(--purple)">
    <animateMotion dur="1.6s" begin=".4s" repeatCount="indefinite"><mpath href="#v-stt"/></animateMotion>
  </circle>
  <circle class="dot" r="5" fill="var(--purple)">
    <animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite"><mpath href="#v-llm"/></animateMotion>
  </circle>
  <circle class="dot" r="5" fill="var(--pink)">
    <animateMotion dur="2s" begin="1.2s" repeatCount="indefinite"><mpath href="#v-post"/></animateMotion>
  </circle>
  <circle class="dot" r="5" fill="var(--teal)">
    <animateMotion dur="1.8s" begin="1.6s" repeatCount="indefinite"><mpath href="#v-out"/></animateMotion>
  </circle>
</svg>
</div>
</body>
</html>
